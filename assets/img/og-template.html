<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Spline Sans Mono'; src: url('../fonts/spline-sans-mono.woff2') format('woff2'); font-weight: 300 700; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #EDDBC4; position: relative; font-family: 'Spline Sans Mono', monospace; overflow: hidden; }
  .frame { position: absolute; inset: 36px; border: 1px solid rgba(42,33,24,0.42); }
  .logo { position: absolute; left: 120px; top: 200px; width: 560px; }
  .slogan { position: absolute; left: 124px; top: 430px; font-size: 21px; letter-spacing: 0.12em; text-transform: uppercase; color: #2A2118; font-weight: 500; }
  .meta { position: absolute; left: 124px; bottom: 66px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B4526; font-weight: 500; }
  .star { position: absolute; right: 110px; top: 110px; width: 108px; height: 108px; }
  .tick { position: absolute; right: 124px; bottom: 66px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B4526; font-weight: 500; }
</style>
</head>
<body>
  <div class="frame"></div>
  <img class="logo" src="logo-white.webp" alt="">
  <div class="slogan">Helping clinics reach the stars</div>
  <div class="meta">Marketing for aesthetic clinics</div>
  <div class="tick">astramarketing.gr</div>
  <svg class="star" viewBox="0 0 24 24" fill="#FEFEFE"><path d="M12 0C12.9 7.4 16.6 11.1 24 12c-7.4.9-11.1 4.6-12 12-.9-7.4-4.6-11.1-12-12 7.4-.9 11.1-4.6 12-12Z"/></svg>
</body>
</html>
