<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>astra | Η κλήση επιβεβαιώθηκε</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDDBC4">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<style>
  @font-face { font-family: 'Archivo'; src: url('assets/fonts/archivo.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  @font-face { font-family: 'Spline Sans Mono'; src: url('assets/fonts/spline-sans-mono.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'Roboto Flex'; src: url('assets/fonts/robotoflex-greek-var.woff2') format('woff2'); font-weight: 100 1000; font-stretch: 25% 151%; font-display: swap; unicode-range: U+0370-03FF; }
  @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/jbmono-greek-var.woff2') format('woff2'); font-weight: 100 800; font-display: swap; unicode-range: U+0370-03FF; }
  :root { --bg: #EDDBC4; --white: #FDFBF7; --display: #FEFEFE; --ink: #2A2118; --soft: #5A4936; --bronze: #9C6B3F; --bronze-text: #6B4526; --hair: rgba(42,33,24,.24);
    --sans: 'Archivo', 'Roboto Flex', 'Helvetica Neue', Arial, sans-serif; --mono: 'Spline Sans Mono', 'JetBrains Mono', Menlo, monospace;
    --lift: 0 10px 28px rgba(107,69,38,.32), 0 3px 8px rgba(107,69,38,.18); --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100svh; display: flex; flex-direction: column; }
  .top { padding: 18px clamp(20px, 5vw, 48px); }
  .top img { width: 84px; filter: drop-shadow(0 3px 4px rgba(107,69,38,.18)) drop-shadow(0 10px 14px rgba(107,69,38,.32)); }
  main { flex: 1; display: grid; place-items: center; padding: 24px clamp(20px, 5vw, 48px) 64px; text-align: center; }
  .wrap { max-width: 720px; }
  .check { width: 64px; height: 64px; margin: 0 auto; display: grid; place-items: center; background: var(--white); color: var(--bronze-text); box-shadow: var(--lift); }
  .check svg { width: 28px; height: 28px; }
  .kicker { display: block; margin-top: 28px; font-family: var(--mono); font-size: .6875rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze-text); }
  h1 { margin-top: 14px; font-weight: 600; font-stretch: 115%; font-variation-settings: "opsz" 36; letter-spacing: -.03em; line-height: 1.05; font-size: clamp(2.2rem, 6vw, 4rem); color: var(--display); text-shadow: var(--lift); text-wrap: balance; }
  .lede { margin: 18px auto 0; max-width: 46ch; color: var(--soft); font-size: clamp(1.05rem, 1.6vw, 1.2rem); line-height: 1.6; }
  ol { list-style: none; counter-reset: s; margin: 36px auto 0; max-width: 560px; text-align: left; border-top: 1px solid var(--hair); }
  li { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--hair); line-height: 1.5; }
  li::before { content: "0" counter(s); font-family: var(--mono); font-size: .75rem; font-weight: 600; letter-spacing: .1em; color: var(--bronze-text); padding-top: 3px; }
  li b { display: block; font-weight: 600; }
  li span { color: var(--soft); font-size: .95rem; }
  .when { margin: 28px auto 0; display: inline-block; padding: 14px 22px; background: var(--white); box-shadow: var(--lift); font-weight: 600; font-size: 1.1rem; color: var(--ink); }
  .when[hidden], .btn[hidden] { display: none; }
  .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn { display: inline-block; padding: 16px 26px; font-family: var(--mono); font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; color: var(--white); background: var(--ink); box-shadow: var(--lift); transition: transform 160ms var(--ease-out); }
  .btn.alt { color: var(--ink); background: var(--white); }
  .btn:active { transform: scale(.97); }
</style>
</head>
<body>
<header class="top"><a href="index.html" aria-label="astra"><img src="assets/img/astra-wordmark-white.svg" alt="astra"></a></header>
<main>
  <div class="wrap">
    <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <span class="kicker">Η κλήση επιβεβαιώθηκε</span>
    <h1>Ευχαριστούμε, τα λέμε σύντομα.</h1>
    <p class="when" id="when" hidden></p>
    <p class="lede">Προσθέστε την κλήση στο ημερολόγιό σας. Την ώρα της κλήσης μπαίνετε στο Google Meet από το ίδιο link.</p>
    <div class="actions">
      <a class="btn" id="gcal" href="#" target="_blank" rel="noopener" hidden>Προσθήκη στο Google Calendar</a>
      <a class="btn alt" id="meet" href="#" target="_blank" rel="noopener" hidden>Google Meet link</a>
    </div>
  </div>
</main>
<script>
(() => {
  // Same web app as assets/funnel.js
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwSIgmmwuxX7ZgElldaDcWAhEfmsZsCE3kShe1XJboo6e-TmsXNlrDoVdbVARYEKdUOIw/exec';
  const qs = new URLSearchParams(location.search);
  const id = (qs.get('i') || '').replace(/[^A-Za-z0-9-]/g, '');
  const start = new Date(qs.get('s') || ''), end = new Date(qs.get('e') || '');
  const meet = qs.get('m') || '';
  const meetOk = /^https:\/\/meet\.google\.com\/[a-z0-9-]+$/i.test(meet);

  // Mark the call as confirmed in the sheet (Emails tab), once per browser
  if (id) {
    let done = false;
    try { done = localStorage.getItem('astra_confirmed_' + id); } catch (e) {}
    if (!done) {
      const body = JSON.stringify({ event: 'confirm', invitee: id });
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      if (!(navigator.sendBeacon && navigator.sendBeacon(ENDPOINT, blob))) {
        fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }).catch(() => {});
      }
      try { localStorage.setItem('astra_confirmed_' + id, '1'); } catch (e) {}
    }
  }

  if (!isNaN(start)) {
    const when = document.getElementById('when');
    const day = new Intl.DateTimeFormat('el-GR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Athens' }).format(start);
    const time = new Intl.DateTimeFormat('el-GR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Europe/Athens' }).format(start);
    when.textContent = day.charAt(0).toUpperCase() + day.slice(1) + ', ' + time + ' (ώρα Ελλάδας)';
    when.hidden = false;

    const stamp = d => d.toISOString().replace(/[-:]|\.\d{3}/g, '');
    const fin = isNaN(end) ? new Date(start.getTime() + 30 * 60000) : end;
    const g = new URL('https://calendar.google.com/calendar/render');
    g.searchParams.set('action', 'TEMPLATE');
    g.searchParams.set('text', 'Στρατηγική κλήση · astra');
    g.searchParams.set('dates', stamp(start) + '/' + stamp(fin));
    g.searchParams.set('details', (meetOk ? 'Google Meet: ' + meet + '\n\n' : '') + 'Βρείτε ένα ήσυχο μέρος και κρατήστε 30 λεπτά για να οργανώσουμε το πλάνο για την κλινική σας.');
    if (meetOk) g.searchParams.set('location', meet);
    const a = document.getElementById('gcal'); a.href = g.toString(); a.hidden = false;
  }
  if (meetOk) { const m = document.getElementById('meet'); m.href = meet; m.hidden = false; }
})();
</script>
</body>
</html>
